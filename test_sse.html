<!DOCTYPE html>
<html>
<head>
    <title>SSE Test</title>
</head>
<body>
    <h1>Server-Sent Events Test</h1>
    <button onclick="startStream()">Start Stream</button>
    <button onclick="stopStream()">Stop Stream</button>
    <div id="output" style="border: 1px solid #ccc; padding: 10px; margin-top: 10px; min-height: 200px;"></div>
    
    <h2>Test AI Chat Stream</h2>
    <input type="text" id="message" placeholder="Enter message" value="What is machine learning?">
    <button onclick="testAIStream()">Test AI Stream</button>
    <div id="ai-output" style="border: 1px solid #ccc; padding: 10px; margin-top: 10px; min-height: 200px;"></div>

    <script>
        let eventSource;

        function startStream() {
            const output = document.getElementById('output');
            output.innerHTML = 'Starting stream...<br>';
            
            eventSource = new EventSource('http://localhost:8080/test-stream');
            
            eventSource.onmessage = function(event) {
                const data = JSON.parse(event.data);
                output.innerHTML += `Received: ${JSON.stringify(data)}<br>`;
                
                if (data.type === 'done') {
                    eventSource.close();
                }
            };
            
            eventSource.onerror = function(error) {
                output.innerHTML += `Error: ${error}<br>`;
                eventSource.close();
            };
        }
        
        function stopStream() {
            if (eventSource) {
                eventSource.close();
                document.getElementById('output').innerHTML += 'Stream stopped<br>';
            }
        }
        
        async function testAIStream() {
            const output = document.getElementById('ai-output');
            const message = document.getElementById('message').value;
            output.innerHTML = 'Sending request...<br>';
            
            try {
                const response = await fetch('http://localhost:8080/ai-chat-stream', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    credentials: 'include',
                    body: JSON.stringify({
                        userMessage: message,
                        messages: []
                    })
                });
                
                output.innerHTML += `Status: ${response.status}<br>`;
                output.innerHTML += `Content-Type: ${response.headers.get('content-type')}<br>`;
                
                if (response.ok && response.headers.get('content-type')?.includes('text/event-stream')) {
                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();
                    
                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;
                        
                        const chunk = decoder.decode(value);
                        output.innerHTML += `Chunk: <pre>${chunk}</pre>`;
                    }
                } else {
                    const text = await response.text();
                    output.innerHTML += `Response: ${text}<br>`;
                }
            } catch (error) {
                output.innerHTML += `Error: ${error}<br>`;
            }
        }
    </script>
</body>
</html>
