
services:
  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: learnx:prod
    build:
      context: ./docker-image
      dockerfile: docker/Dockerfile.prod
    restart: always
    env_file:
      - ./docker-image/.env
    environment:
      - FLASK_ENV=production
      - PORT=8000
      - WORKERS=4
      - WORKER_CLASS=gevent
      - WORKER_CONNECTIONS=1000
      - MAX_REQUESTS=1000
      - MAX_REQUESTS_JITTER=50
      - REDIS_URL=redis://redis:6379/0
      - USE_S3_STORAGE=true
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  celery-worker:
    image: learnx:prod
    restart: always
    command: ["bash", "-c", "cd /app && celery -A src.celery_app worker --loglevel=info --concurrency=4"]
    env_file:
      - ./docker-image/.env
    environment:
      - FLASK_ENV=production
      - REDIS_URL=redis://redis:6379/0
      - USE_S3_STORAGE=true
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      - backend
      - redis
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  celery-beat:
    image: learnx:prod
    restart: always
    command: ["bash", "-c", "cd /app && celery -A src.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule"]
    env_file:
      - ./docker-image/.env
    environment:
      - FLASK_ENV=production
      - REDIS_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      - backend
      - redis
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  flower:
    image: ghcr.io/${GITHUB_REPOSITORY}:${TAG:-latest}
    restart: always
    command: celery -A celery_app flower --port=5555 --basic_auth=${FLOWER_BASIC_AUTH}
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
    ports:
      - "5555:5555"
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

networks:
  default:
    driver: bridge

volumes:
  redis_data: