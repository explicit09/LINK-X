version: '3.8'

services:
  backend:
    build:
      context: ./docker-image
      dockerfile: Dockerfile
    image: linkx-backend:dev
    container_name: linkx-backend-dev
    env_file:
      - ./docker-image/src/.env
    environment:
      FLASK_ENV: development
      FLASK_DEBUG: 1
    volumes:
      # Use delegated consistency for better performance on macOS
      - ./docker-image/src:/app/src:delegated
      - ./data/learning_pdfs:/app/src/learning_pdfs:cached
      - ./data/faiss_generated:/app/src/faiss_generated:cached
    ports:
      - "8080:8080"
    command: ["bash", "-c", "cd /app/src && python -m flask run --host=0.0.0.0 --port=8080 --reload"]