<!DOCTYPE html>
<html>
<head>
    <title>Debug Supabase Auth</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body>
    <h1>Debug Supabase Authentication</h1>
    <button onclick="checkSession()">Check Current Session</button>
    <button onclick="signInWithGoogle()">Sign in with Google</button>
    <button onclick="signOut()">Sign Out</button>
    <pre id="output"></pre>

    <script>
        const supabaseUrl = 'https://torsffahnivnzcnjnxgc.supabase.co';
        const supabaseAnonKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRvcnNmZmFobml2bnpjbmpueGdjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDkxMzc3MzcsImV4cCI6MjA2NDcxMzczN30.RSplRmOfX5noj_MDpRIRRgUbUYSvlaCXyUGc8PUiySA';
        
        const supabase = window.supabase.createClient(supabaseUrl, supabaseAnonKey, {
            auth: {
                autoRefreshToken: true,
                persistSession: true,
                detectSessionInUrl: true,
                flowType: 'implicit'
            }
        });

        function log(message, data = null) {
            const output = document.getElementById('output');
            const timestamp = new Date().toISOString();
            output.textContent += `[${timestamp}] ${message}\n`;
            if (data) {
                output.textContent += JSON.stringify(data, null, 2) + '\n';
            }
            output.textContent += '\n';
        }

        async function checkSession() {
            try {
                const { data: { session }, error } = await supabase.auth.getSession();
                if (error) {
                    log('Session Error:', error);
                } else if (session) {
                    log('Active Session Found:', {
                        user: session.user.email,
                        access_token: session.access_token.substring(0, 50) + '...',
                        expires_at: new Date(session.expires_at * 1000).toISOString()
                    });
                    
                    // Test the token with backend
                    testBackendAuth(session.access_token);
                } else {
                    log('No active session');
                }
            } catch (err) {
                log('Check Session Error:', err);
            }
        }

        async function testBackendAuth(token) {
            try {
                const response = await fetch('http://localhost:8080/api/v2/auth/me', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                log(`Backend Auth Test: ${response.status}`, {
                    status: response.status,
                    statusText: response.statusText
                });
                
                if (response.ok) {
                    const data = await response.json();
                    log('Backend Response:', data);
                } else {
                    const errorText = await response.text();
                    log('Backend Error:', errorText);
                }
            } catch (err) {
                log('Backend Request Error:', err);
            }
        }

        async function signInWithGoogle() {
            try {
                const { data, error } = await supabase.auth.signInWithOAuth({
                    provider: 'google',
                    options: {
                        redirectTo: window.location.origin + '/debug-auth.html'
                    }
                });
                
                if (error) {
                    log('Google Sign In Error:', error);
                } else {
                    log('Google Sign In Initiated:', data);
                }
            } catch (err) {
                log('Google Sign In Exception:', err);
            }
        }

        async function signOut() {
            try {
                const { error } = await supabase.auth.signOut();
                if (error) {
                    log('Sign Out Error:', error);
                } else {
                    log('Signed out successfully');
                    document.getElementById('output').textContent = '';
                }
            } catch (err) {
                log('Sign Out Exception:', err);
            }
        }

        // Auto-check session on page load
        window.onload = checkSession;
    </script>
</body>
</html>
