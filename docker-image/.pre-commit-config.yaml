repos:
  # Built-in hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: debug-statements
      - id: check-docstring-first

  # Python formatting
  - repo: https://github.com/psf/black
    rev: 23.7.0
    hooks:
      - id: black
        args: [--line-length=88]
        files: ^src/.*\.py$

  # Import sorting
  - repo: https://github.com/pycqa/isort
    rev: 5.12.0
    hooks:
      - id: isort
        args: [--profile=black, --line-length=88]
        files: ^src/.*\.py$

  # Linting
  - repo: https://github.com/pycqa/flake8
    rev: 6.0.0
    hooks:
      - id: flake8
        args: [--max-line-length=88, --extend-ignore=E203,W503]
        files: ^src/.*\.py$

  # Security checks
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.5
    hooks:
      - id: bandit
        args: [-r, -f, json, -o, security-report.json]
        files: ^src/.*\.py$

  # Dockerfile linting
  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint-docker
        files: ^docker/Dockerfile.*

  # Environment file checks
  - repo: local
    hooks:
      - id: check-env-files
        name: Check for .env files in commits
        entry: bash -c 'if git diff --cached --name-only | grep -E "\.env$"; then echo "❌ .env files should not be committed"; exit 1; fi'
        language: system
        always_run: true

      - id: check-secrets
        name: Check for hardcoded secrets
        entry: bash -c 'if git diff --cached -U0 | grep -E "(password|secret|key|token).*=.*[^_](dev|test|prod|admin)" --ignore-case; then echo "❌ Potential hardcoded secrets found"; exit 1; fi'
        language: system
        always_run: true 