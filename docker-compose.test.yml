version: '3.8'

services:
  # Test database (isolated from main database)
  test-postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: learnx_test
    volumes:
      - ./docker-image/src/db/migrations/0000_initial_schema.sql:/docker-entrypoint-initdb.d/00_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser -d learnx_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Test Redis
  test-redis:
    image: redis:7-alpine
    command: redis-server --requirepass testpass
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Test backend
  test-backend:
    build:
      context: ./docker-image
      dockerfile: docker/Dockerfile.dev
    environment:
      DATABASE_URL: postgresql://testuser:testpass@test-postgres:5432/learnx_test
      REDIS_URL: redis://:testpass@test-redis:6379/0
      FLASK_ENV: testing
      SECRET_KEY: test-secret-key
      FIREBASE_PROJECT_ID: test-project
      FIREBASE_PRIVATE_KEY: "-----BEGIN PRIVATE KEY-----\ntest-key\n-----END PRIVATE KEY-----"
      FIREBASE_CLIENT_EMAIL: test@test.com
      FIREBASE_CLIENT_ID: test-client-id
    depends_on:
      test-postgres:
        condition: service_healthy
      test-redis:
        condition: service_healthy
    volumes:
      - ./docker-image/src:/app
    command: pytest -v --tb=short

  # E2E test runner
  e2e-tests:
    image: mcr.microsoft.com/playwright:v1.40.0-focal
    environment:
      BACKEND_URL: http://test-backend:8000
      FRONTEND_URL: http://test-frontend:3000
      CI: "true"
    volumes:
      - ./frontend/__tests__/e2e:/tests
      - ./test-results:/test-results
    working_dir: /tests
    command: npx playwright test --reporter=html --output=/test-results
    depends_on:
      - test-backend
      - test-frontend

  # Test frontend
  test-frontend:
    build:
      context: ./frontend
      target: development
    environment:
      NEXT_PUBLIC_API_URL: http://test-backend:8000
      NODE_ENV: test
    depends_on:
      - test-backend
    command: npm run dev