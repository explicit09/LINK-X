global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'learn-x-production'
    environment: 'production'
    datacenter: 'main'

# Remote write configuration for long-term storage (optional)
# remote_write:
#   - url: "https://prometheus-remote-write-endpoint.com/api/v1/write"
#     basic_auth:
#       username: "${REMOTE_WRITE_USER}"
#       password: "${REMOTE_WRITE_PASS}"

scrape_configs:
  # Application metrics with enhanced configuration
  - job_name: 'learn-x-backend'
    static_configs:
      - targets: ['backend:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s
    honor_labels: true
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'backend:8000'
      - source_labels: [__name__]
        target_label: job
        replacement: 'learn-x-backend'
    
  # Flask metrics exporter with enhanced config
  - job_name: 'flask-exporter'
    static_configs:
      - targets: ['flask_exporter:9092']
    scrape_interval: 15s
    
  # Database metrics with enhanced queries
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres_exporter:9187']
    scrape_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'postgres-main'
    
  # Redis metrics
  - job_name: 'redis'
    static_configs:
      - targets: ['redis_exporter:9121']
    scrape_interval: 30s
    
  # Node metrics with extended collection
  - job_name: 'node'
    static_configs:
      - targets: ['node_exporter:9100']
    scrape_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'production-server'
    
  # Container metrics
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    scrape_interval: 30s
    
  # Celery worker metrics via Flower
  - job_name: 'celery'
    static_configs:
      - targets: ['flower:5555']
    metrics_path: '/metrics'
    scrape_interval: 30s
    
  # Custom application metrics endpoint
  - job_name: 'app-custom-metrics'
    static_configs:
      - targets: ['backend:8000']
    metrics_path: '/api/metrics/custom'
    scrape_interval: 60s
    
  # Streaming service metrics
  - job_name: 'streaming-metrics'
    static_configs:
      - targets: ['backend:8000']
    metrics_path: '/api/metrics/streaming'
    scrape_interval: 30s
    
  # Business metrics
  - job_name: 'business-metrics'
    static_configs:
      - targets: ['backend:8000']
    metrics_path: '/api/metrics/business'
    scrape_interval: 300s  # 5 minutes for business metrics
    
  # Security metrics
  - job_name: 'security-metrics'
    static_configs:
      - targets: ['backend:8000']
    metrics_path: '/api/metrics/security'
    scrape_interval: 60s
    
  # File processing metrics
  - job_name: 'file-processing'
    static_configs:
      - targets: ['backend:8000']
    metrics_path: '/api/metrics/files'
    scrape_interval: 60s
    
  # S3 storage metrics (if available)
  - job_name: 's3-metrics'
    static_configs:
      - targets: ['s3_exporter:9190']
    scrape_interval: 300s
    scrape_timeout: 30s
    
  # Load balancer metrics (if nginx/haproxy is used)
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx_exporter:9113']
    scrape_interval: 30s
    
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 30s
      
  # Grafana metrics
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
    metrics_path: '/metrics'
    scrape_interval: 60s
      
  # Alertmanager metrics
  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']
    scrape_interval: 30s

  # Blackbox exporter for external monitoring
  - job_name: 'blackbox'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
        - https://your-domain.com
        - https://your-domain.com/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox_exporter:9115

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - '/etc/prometheus/alerts/*.yml'