services:
  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: learnx:optimized
    restart: always
    env_file:
      - ./docker-image/.env
    environment:
      - FLASK_ENV=${FLASK_ENV:-development}
      - REDIS_URL=redis://redis:6379/0
      - USE_SUPABASE_STORAGE=true
      - PORT=${PORT:-8000}
      # Supabase configuration
      - SUPABASE_URL=https://torsffahnivnzcnjnxgc.supabase.co
      - SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRvcnNmZmFobml2bnpjbmpueGdjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDkxMzc3MzcsImV4cCI6MjA2NDcxMzczN30.RSplRmOfX5noj_MDpRIRRgUbUYSvlaCXyUGc8PUiySA
      - SUPABASE_SERVICE_ROLE_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRvcnNmZmFobml2bnpjbmpueGdjIiwicm9sZSI6InNlcnZpY2VfX3JvbGUiLCJpYXQiOjE3NDkxMzc3MzcsImV4cCI6MjA2NDcxMzczN30.QXKXdZaYaGJo4k-2LdD3qD3c9gvXFQHPGIWCLBu59j0
      - SUPABASE_JWT_SECRET=EBdk62TNJ2Ku7oMGN4ZXCjIOsg17P9PydhA9/orqUYV+cADaT/ZbTFMpCo90FfG05StLcKdrfH9zDeqLI2xIRg==
      - DATABASE_URL=postgresql://postgres.torsffahnivnzcnjnxgc:DjGJCVNYksijOQuG@aws-0-us-east-2.pooler.supabase.com:6543/postgres
      # Disable optional dependencies
      - DISABLE_REDIS=1
      - DISABLE_CELERY=1
    volumes:
      - ./docker-image/src:/app/src:cached  # Dev only - hot reload
      - ./data/learning_pdfs:/app/src/learning_pdfs
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT:-8000}/api/v2/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # No profiles - always runs with backend

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: learnx:optimized
    restart: always
    entrypoint: ["/app/docker/celery-entrypoint.sh"]
    command: ["worker"]
    env_file:
      - ./docker-image/.env
    environment:
      - FLASK_ENV=${FLASK_ENV:-development}
      - REDIS_URL=redis://redis:6379/0
      - USE_SUPABASE_STORAGE=true
      # Supabase configuration
      - SUPABASE_URL=https://torsffahnivnzcnjnxgc.supabase.co
      - SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRvcnNmZmFobml2bnpjbmpueGdjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDkxMzc3MzcsImV4cCI6MjA2NDcxMzczN30.RSplRmOfX5noj_MDpRIRRgUbUYSvlaCXyUGc8PUiySA
      - SUPABASE_SERVICE_ROLE_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRvcnNmZmFobml2bnpjbmpueGdjIiwicm9sZSI6InNlcnZpY2VfX3JvbGUiLCJpYXQiOjE3NDkxMzc3MzcsImV4cCI6MjA2NDcxMzczN30.QXKXdZaYaGJo4k-2LdD3qD3c9gvXFQHPGIWCLBu59j0
      - SUPABASE_JWT_SECRET=EBdk62TNJ2Ku7oMGN4ZXCjIOsg17P9PydhA9/orqUYV+cADaT/ZbTFMpCo90FfG05StLcKdrfH9zDeqLI2xIRg==
      - DATABASE_URL=postgresql://postgres.torsffahnivnzcnjnxgc:DjGJCVNYksijOQuG@aws-0-us-east-2.pooler.supabase.com:6543/postgres
    volumes:
      - ./docker-image/src:/app/src:cached  # Dev only
      - ./data/learning_pdfs:/app/src/learning_pdfs
    depends_on:
      - redis
      - backend
    profiles:
      - workers
      - prod

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    image: learnx:optimized
    restart: always
    entrypoint: ["/app/docker/celery-entrypoint.sh"]
    command: ["beat"]
    env_file:
      - ./docker-image/.env
    environment:
      - FLASK_ENV=${FLASK_ENV:-development}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
      - backend
    profiles:
      - prod
      - workers

  # PGMQ Embedding Worker - Processes embeddings using PostgreSQL Message Queue
  pgmq-worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: learnx:optimized
    restart: always
    # Wait 30 seconds for backend to initialize database before starting workers
    command: ["sh", "-c", "sleep 30 && python /app/src/startup/embedding_worker_init.py && python -m workers.pgmq_embedding_worker"]
    env_file:
      - ./docker-image/.env
    environment:
      - FLASK_ENV=${FLASK_ENV:-development}
      - REDIS_URL=redis://redis:6379/0
      - USE_SUPABASE_STORAGE=true
      # Supabase configuration
      - SUPABASE_URL=https://torsffahnivnzcnjnxgc.supabase.co
      - SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRvcnNmZmFobml2bnpjbmpueGdjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDkxMzc3MzcsImV4cCI6MjA2NDcxMzczN30.RSplRmOfX5noj_MDpRIRRgUbUYSvlaCXyUGc8PUiySA
      - SUPABASE_SERVICE_ROLE_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRvcnNmZmFobml2bnpjbmpueGdjIiwicm9sZSI6InNlcnZpY2VfX3JvbGUiLCJpYXQiOjE3NDkxMzc3MzcsImV4cCI6MjA2NDcxMzczN30.QXKXdZaYaGJo4k-2LdD3qD3c9gvXFQHPGIWCLBu59j0
      - SUPABASE_JWT_SECRET=EBdk62TNJ2Ku7oMGN4ZXCjIOsg17P9PydhA9/orqUYV+cADaT/ZbTFMpCo90FfG05StLcKdrfH9zDeqLI2xIRg==
      - DATABASE_URL=postgresql://postgres.torsffahnivnzcnjnxgc:DjGJCVNYksijOQuG@aws-0-us-east-2.pooler.supabase.com:6543/postgres
      # OpenAI configuration (if not stored in database)
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # Worker specific settings
      - WORKER_ID=pgmq-worker-1
      - BATCH_SIZE=100
      - MAX_RETRIES=3
    volumes:
      - ./docker-image/src:/app/src:cached
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "python", "-c", "import psycopg2; conn = psycopg2.connect('${DATABASE_URL}'); conn.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
    # No profiles - always runs automatically
    deploy:
      replicas: 3  # Run 3 worker instances in production

  flower:
    build:
      context: .
      dockerfile: Dockerfile
    image: learnx:optimized
    restart: always
    entrypoint: ["/app/docker/celery-entrypoint.sh"]
    command: ["flower"]
    environment:
      - FLASK_ENV=${FLASK_ENV:-development}
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "5555:5555"
    depends_on:
      - redis
      - celery-worker
    profiles:
      - monitoring
      - prod

volumes:
  redis_data:

# Usage:
# Development: docker-compose up
# Production: DOCKER_ENV=prod FLASK_ENV=production PORT=8000 docker-compose up
# With monitoring: docker-compose --profile monitoring up
# Scale workers: docker-compose up -d --scale pgmq-worker=5