services:
  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./docker-image
      dockerfile: docker/Dockerfile.${DOCKER_ENV:-dev}
    image: learnx:dev-fixed
    restart: always
    env_file:
      - ./docker-image/.env
    environment:
      - FLASK_ENV=${FLASK_ENV:-development}
      - REDIS_URL=redis://redis:6379/0
      - USE_S3_STORAGE=${USE_S3_STORAGE:-true}
      - PORT=${PORT:-8080}
    volumes:
      - ./docker-image/src:/app/src:cached  # Dev only - hot reload
      - ./data/learning_pdfs:/app/src/learning_pdfs
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT:-8080}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    profiles:
      - dev
      - prod

  celery-worker:
    build:
      context: ./docker-image
      dockerfile: docker/Dockerfile.${DOCKER_ENV:-dev}
    image: learnx:dev-fixed
    restart: always
    entrypoint: ["/app/docker/celery-entrypoint.sh"]
    command: ["worker"]
    env_file:
      - ./docker-image/.env
    environment:
      - FLASK_ENV=${FLASK_ENV:-development}
      - REDIS_URL=redis://redis:6379/0
      - USE_S3_STORAGE=${USE_S3_STORAGE:-true}
    volumes:
      - ./docker-image/src:/app/src:cached  # Dev only
      - ./data/learning_pdfs:/app/src/learning_pdfs
    depends_on:
      - redis
      - backend
    profiles:
      - dev
      - prod
      - workers

  celery-beat:
    build:
      context: ./docker-image
      dockerfile: docker/Dockerfile.${DOCKER_ENV:-dev}
    image: learnx:dev-fixed
    restart: always
    entrypoint: ["/app/docker/celery-entrypoint.sh"]
    command: ["beat"]
    env_file:
      - ./docker-image/.env
    environment:
      - FLASK_ENV=${FLASK_ENV:-development}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
      - backend
    profiles:
      - prod
      - workers

  flower:
    build:
      context: ./docker-image
      dockerfile: docker/Dockerfile.${DOCKER_ENV:-dev}
    image: learnx:dev-fixed
    restart: always
    entrypoint: ["/app/docker/celery-entrypoint.sh"]
    command: ["flower"]
    environment:
      - FLASK_ENV=${FLASK_ENV:-development}
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "5555:5555"
    depends_on:
      - redis
      - celery-worker
    profiles:
      - monitoring
      - prod

volumes:
  redis_data:

# Usage:
# Development: docker-compose --profile dev up
# Production: DOCKER_ENV=prod FLASK_ENV=production PORT=8000 docker-compose --profile prod up
# With monitoring: docker-compose --profile prod --profile monitoring up
# Just workers: docker-compose --profile workers up