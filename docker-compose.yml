version: '3.8'

services:
  backend:
    build:
      context: ./docker-image
    image: dev7
    container_name: backend
    env_file:
      - ./docker-image/src/.env
    volumes:
      - ./docker-image/src:/app/src
      - ./data/learning_pdfs:/app/src/learning_pdfs
      # - ./data/faiss_generated:/app/src/faiss_generated  # Removed as we use pgvector now
      - ./docker-image/src/firebaseKey.json:/app/src/firebaseKey.json
    ports:
      - "8080:8080"
      # - "8501:8501"  # Temporarily disabled
    command: ["bash", "-c", "cd /app/src && FLASK_APP=app.py FLASK_ENV=development flask run --host=0.0.0.0 --port=8080"]