version: '3.8'

services:
  backend:
    build:
      context: ./docker-image
    image: dev7
    container_name: backend
    env_file:
      - ./docker-image/src/.env
    volumes:
      - ./docker-image/src:/app/src
      - ./data/learning_pdfs:/app/src/learning_pdfs
      - ./data/faiss_generated:/app/src/faiss_generated
      - ./docker-image/src/firebaseKey.json:/app/src/firebaseKey.json
    ports:
      - "8081:8080"
      - "8501:8501"
    command: ["bash", "-c", "cd /app && python -c \"import sys; sys.path.append('/app'); from src.app import app; app.run(host='0.0.0.0', port=8080, debug=True)\""]