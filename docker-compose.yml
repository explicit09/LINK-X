# Enable BuildKit by default
x-build: &default-build
  context: .
  dockerfile: Dockerfile
  args:
    BUILDKIT_INLINE_CACHE: 1

services:
  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "6379:6379"

  backend:
    build:
      <<: *default-build
    image: learnx:optimized
    restart: always
    env_file:
      - ./docker-image/.env
    environment:
      - FLASK_ENV=${FLASK_ENV:-development}
      - REDIS_URL=redis://redis:6379/0
      - USE_SUPABASE_STORAGE=true
      - PORT=${PORT:-8000}
      # Supabase configuration (from .env file)
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET}
      - DATABASE_URL=${DATABASE_URL}
      # Disable optional dependencies
      - DISABLE_REDIS=1
      - DISABLE_CELERY=1
    volumes:
      - ./docker-image/src:/app/src:cached  # Dev only - hot reload
      - ./data/learning_pdfs:/app/src/learning_pdfs
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT:-8000}/api/v2/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # No profiles - always runs with backend

  celery-worker:
    build:
      <<: *default-build
    image: learnx:optimized
    restart: always
    entrypoint: ["/app/docker/celery-entrypoint.sh"]
    command: ["worker"]
    env_file:
      - ./docker-image/.env
    environment:
      - FLASK_ENV=${FLASK_ENV:-development}
      - REDIS_URL=redis://redis:6379/0
      - USE_SUPABASE_STORAGE=true
      # Supabase configuration (from .env file)
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET}
      - DATABASE_URL=${DATABASE_URL}
    volumes:
      - ./docker-image/src:/app/src:cached  # Dev only
      - ./data/learning_pdfs:/app/src/learning_pdfs
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "celery", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    # Removed profiles - worker runs automatically

  celery-beat:
    build:
      <<: *default-build
    image: learnx:optimized
    restart: always
    entrypoint: ["/app/docker/celery-entrypoint.sh"]
    command: ["beat"]
    env_file:
      - ./docker-image/.env
    environment:
      - FLASK_ENV=${FLASK_ENV:-development}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    # Removed profiles - scheduler runs automatically

  # PGMQ Embedding Worker - Processes embeddings using PostgreSQL Message Queue
  pgmq-worker:
    build:
      <<: *default-build
    image: learnx:optimized
    restart: always
    # Use proper startup script instead of hardcoded sleep
    command: ["python", "/app/src/startup/embedding_worker_init.py"]
    env_file:
      - ./docker-image/.env
    environment:
      - FLASK_ENV=${FLASK_ENV:-development}
      - REDIS_URL=redis://redis:6379/0
      - USE_SUPABASE_STORAGE=true
      # Supabase configuration (from .env file)
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET}
      - DATABASE_URL=${DATABASE_URL}
      # OpenAI configuration loaded from .env file
      # Worker specific settings
      - WORKER_ID=pgmq-worker-1
      - BATCH_SIZE=100
      - MAX_RETRIES=3
    volumes:
      - ./docker-image/src:/app/src:cached
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import psycopg2; conn = psycopg2.connect('${DATABASE_URL}'); conn.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # No profiles - always runs automatically
    deploy:
      replicas: ${EMBEDDING_WORKERS:-3}  # Configurable worker count

  # Supabase Bridge - Processes the processing_queue for file uploads and processing
  supabase-bridge:
    build:
      <<: *default-build
    image: learnx:optimized
    restart: always
    command: ["python", "-m", "services.supabase_bridge"]
    env_file:
      - ./docker-image/.env
    environment:
      - FLASK_ENV=${FLASK_ENV:-development}
      - USE_SUPABASE_STORAGE=true
      # Supabase configuration (from .env file)
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET}
      - DATABASE_URL=${DATABASE_URL}
      # OpenAI configuration loaded from .env file
      # Bridge specific settings
      - WORKER_ID=supabase-bridge-1
      - BRIDGE_POLL_INTERVAL=${BRIDGE_POLL_INTERVAL:-10}
      - BRIDGE_MAX_JOBS=${BRIDGE_MAX_JOBS:-3}
    volumes:
      - ./docker-image/src:/app/src:cached
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import psycopg2; conn = psycopg2.connect('${DATABASE_URL}'); conn.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # No profiles - always runs automatically for production deployment

  flower:
    build:
      <<: *default-build
    image: learnx:optimized
    restart: always
    entrypoint: ["/app/docker/celery-entrypoint.sh"]
    command: ["flower"]
    environment:
      - FLASK_ENV=${FLASK_ENV:-development}
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "5555:5555"
    depends_on:
      - redis
      - celery-worker
    profiles:
      - monitoring
      - prod

volumes:
  redis_data:

# Usage:
# Development: docker-compose up
# Production: DOCKER_ENV=prod FLASK_ENV=production PORT=8000 docker-compose up
# With monitoring: docker-compose --profile monitoring up
# Scale workers: docker-compose up -d --scale pgmq-worker=5